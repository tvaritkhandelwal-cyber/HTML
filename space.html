
<!DOCTYPE html>
<head>
    <title>My space page</title>
    <style>
        .Header{
            background-image: linear-gradient(to right, blue, purple, black ); 
            color: lightgreen;
        }
        .Header p{
            color: bisque;
            font-size: 18px;
        }

        .infoBox{
            background-image: linear-gradient( green, yellow, black );
            height: 350px;
            font-size: 30px ;
            text-align: center;
        }

        .star{
            height: 200px;
            width: 200px;
            background-image: radial-gradient(yellow, orange);
            border-radius: 50%;
            animation-name: twinkle;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        @keyframes twinkle {
            from {
                background-image: radial-gradient(yellow, orange );
            }
            to {
                background-image: radial-gradient(orange, yellow );
            }
        }
        .footer{
            background-color: blue;
            font-size: 20px;
            color: aqua;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="Header">
        <h1>My Space Page</h1>
        <p>Space is large and interesting</p>
    </div>

    <div class="infoBox">
        <h2>Fun Fact</h2>
        <p>Space is forever explanding, and is enourmous</p>
    </div>
    <br>
    <div class="star"></div>
    <br>
    <p class="footer">Made By Tvarit Khandelwal</p>
</body>
</html>
