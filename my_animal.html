<!DOCTYPE html>
<head>
    <title>Snow Leopard Fact File</title>
    <style>
        body{
            background-color: darkgreen;
            font-family: Arial, sans-serif;
        }
        .fact-file{
            background-color: lightyellow;
            color:darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid forestgreen;
            margin: 30px;
        }
        .animal-name{
            color: forestgreen;
            font-size: 22px;
        }
        .cool-fact{
            color: darkorange;
            font-style: italic;
        }
        .detail{
            color: darkslategray;
        }

    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: big cat</p>
        <p class="detail">Lives in:Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Deer, Goats and wild sheep</p>
        <p class="cool-fact">Cool fact: Can leap up to 15 meters in on jump!</p>
    </div>
</body>
</html>
